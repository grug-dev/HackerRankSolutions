name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run tests
        run: ./gradlew test
      - name: Show line coverage
        run: |
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
            END { printf "Line coverage: %.1f%% (%d of %d lines)\n", 100 * covered / (missed + covered), covered, missed + covered }' \
            build/reports/jacoco/test/jacocoTestReport.csv | tee -a "$GITHUB_STEP_SUMMARY"
